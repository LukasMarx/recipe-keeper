<div class="chart-card">
  <div class="chart-card__header">
    <span class="chart-card__title">{{ title() }}</span>
    <span class="chart-card__average">
      Ø {{ average() | number: '1.0-0' }}&thinsp;{{ unit() }}
    </span>
  </div>

  <svg
    class="chart-svg"
    [attr.viewBox]="viewBox"
    preserveAspectRatio="none"
    aria-hidden="true"
  >
    @for (bar of bars(); track bar.date) {
      <rect
        rx="2"
        class="chart-bar"
        [class.chart-bar--today]="bar.isToday"
        [attr.x]="bar.x"
        [attr.y]="bar.y"
        [attr.width]="bar.width"
        [attr.height]="bar.height"
      />
    }
    <line
      class="chart-avg-line"
      x1="0"
      x2="320"
      [attr.y1]="averageLineY()"
      [attr.y2]="averageLineY()"
      stroke-dasharray="3 2"
    />
  </svg>
</div>
