<header class="page-header" [class.page-header--sticky]="sticky()">
	<div class="page-header__copy">
		@if (showLogo()) {
			<img class="page-header__logo" [src]="logoSrc()" [alt]="logoAlt()" />
		}

		<div class="page-header__text">
			@if (eyebrow(); as eyebrow) {
				<span class="page-header__eyebrow">{{ eyebrow }}</span>
			}

			<h1>{{ title() }}</h1>

			@if (subtitle(); as subtitle) {
				<p>{{ subtitle }}</p>
			}
		</div>
	</div>

	@if (actionLabel(); as actionLabel) {
		<button
			type="button"
			class="page-header__action"
			[disabled]="actionDisabled()"
			[attr.aria-label]="actionAriaLabel() || actionLabel"
			(click)="onActionTriggered()"
		>
			@if (actionIcon(); as actionIcon) {
				<mat-icon>{{ actionIcon }}</mat-icon>
			}

			<span>{{ actionLabel }}</span>
		</button>
	}
</header>
